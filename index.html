
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith Resolution Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --lux-gold: #c5a059;
        --lux-bg: #fdfcfb;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--lux-bg);
        color: #2d2d2d;
      }
      .serif-heading {
        font-family: 'Cormorant Garamond', serif;
      }
      .glass-morphism {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(197, 160, 89, 0.1);
      }
      .lux-border {
        border-color: rgba(197, 160, 89, 0.15);
      }
      .gold-gradient-text {
        background: linear-gradient(to right, #8e6e37, #c5a059, #8e6e37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .lux-shadow {
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.03), 0 0 15px -3px rgba(197, 160, 89, 0.05);
      }
      input::placeholder, textarea::placeholder {
        color: #a3a3a3;
        font-style: italic;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e5e5e5;
        border-radius: 10px;
      }
      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
    "jspdf": "https://esm.sh/jspdf@^2.5.1"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
